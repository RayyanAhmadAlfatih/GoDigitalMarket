; optional PHP runtime settings for shared hosting/VPS.
; Jika panel hosting sudah mengatur open_basedir, biarkan baris open_basedir tetap nonaktif.
; Jika ingin mengaktifkan, sesuaikan path root website Anda terlebih dahulu.
; open_basedir=/full/path/to/website/:/tmp/

upload_max_filesize=16M
post_max_size=20M
max_execution_time=120
memory_limit=256M
