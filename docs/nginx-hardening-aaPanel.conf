# Tambahkan di dalam blok server { ... } aaPanel, sebelum location static assets.
# Tujuan: mencegah folder source/config/storage/backup terbaca publik di Nginx.

location ^~ /config/ { deny all; }
location ^~ /core/ { deny all; }
location ^~ /pages/ { deny all; }
location ^~ /components/ { deny all; }
location ^~ /data/ { deny all; }
location ^~ /storage/ { deny all; }
location ^~ /logs/ { deny all; }
location ^~ /docs/ { deny all; }
location ^~ /cache/ { deny all; }
location ^~ /feeds/ { deny all; }
location ^~ /assets/uploads/form-files/ { deny all; }

location ~* /(\.env|\.user\.ini|\.htaccess|\.git|composer\.(json|lock)|package(-lock)?\.json)$ {
    deny all;
}

location ~* \.(env|ini|log|sql|sh|bak|backup|old|orig|save|swp|dist|md|csv|jsonl)$ {
    deny all;
}

location = /favicon.ico {
    try_files /assets/images/favicon.png =204;
    access_log off;
    log_not_found off;
}

location ~* \.(gif|jpg|jpeg|png|bmp|webp|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
    log_not_found off;
}

location ~* \.(js|css)$ {
    expires 12h;
    add_header Cache-Control "public, max-age=43200";
    access_log off;
    log_not_found off;
}
